<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Mobile / Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      EVENT. | Premium Event Management & Experiences
    </title>

    <meta
      name="description"
      content="EVENT. creates premium event experiences including corporate events, weddings, conferences, product launches and special celebrations."
    />

    <meta
      name="keywords"
      content="event management, event planner, corporate events, weddings, conferences, product launches, event experiences, Hyderabad events"
    />

    <meta name="author" content="EVENT." />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#071A17"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="EVENT. | Premium Event Management & Experiences"
    />

    <meta
      property="og:description"
      content="We create premium event experiences that people remember."
    />

    <meta
      property="og:site_name"
      content="EVENT."
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="EVENT. | Premium Event Management & Experiences"
    />

    <meta
      name="twitter:description"
      content="We create premium event experiences that people remember."
    />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

  </head>

    <div id="root"></div>

      type="module"
